name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Build v1.5.0
        shell: pwsh
        run: ./build-release.ps1 -Version 1.5.0

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Muusy-Island-v1.5.0
          path: |
            release/Muusy-Island-v1.5.0.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v1.5.0') {
            throw "This release workflow currently expects tag v1.5.0"
          }

      - name: Build release
        shell: pwsh
        run: ./build-release.ps1 -Version 1.5.0

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.5.0'
          $zip = './release/Muusy-Island-v1.5.0.zip'
          $checksum = './release/SHA256SUMS.txt'
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $checksum --clobber
            gh release edit $tag --title 'Muusy Island v1.5.0' --notes-file './RELEASE_NOTES_v1.5.0.md'
          } else {
            gh release create $tag $zip $checksum --title 'Muusy Island v1.5.0' --notes-file './RELEASE_NOTES_v1.5.0.md'
          }
